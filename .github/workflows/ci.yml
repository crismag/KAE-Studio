# Studio had no CI. That is how a control renamed in one commit left its unit
# test asserting on a button that no longer existed, green in nobody's terminal,
# for six days — alongside two type errors and an unused import, all from the
# same change.
#
# The scripts existed the whole time. What was missing was anything that ran
# them when it mattered rather than when someone remembered.
#
# **The browser suite is deliberately absent.** `e2e/` drives a real Studio
# against a real KAE-Memory and writes to a real project — that is the point of
# it, and it is why it found faults the API could not show. There is nothing
# here for it to talk to, and a mocked stand-in would pass on precisely the
# defects it exists to catch. It runs against a live stack; see `scripts/dev.sh`.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # Ordered cheapest-first so a formatting slip does not wait on a build.
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      # `tsc -b`, not `tsc --noEmit`. They read different configuration and can
      # disagree: the build config caught an interface a dead adapter no longer
      # satisfied while the bare invocation passed.
      - name: Types
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # `--no-deps`, because `cris-cie-slim` is a private sibling repository
      # and a plain install would try to resolve it from PyPI and fail.
      #
      # The note that used to live here predicted this exactly: *"if a test ever
      # imports the app, this step starts failing and the honest fix is to check
      # CIE out here, not to loosen the dependency."* Tests that import the app
      # were added, and it did.
      #
      # Checking CIE out needs a secret, because this repository is public and
      # `cris-cie-slim` is private — a deploy key or PAT, which is the owner's
      # to grant. Until then the six affected modules `importorskip("cie_slim")`
      # and say why, so collection reports a skip with a reason instead of an
      # error that reads like a broken product. **That is a loosening**, it is
      # recorded as AUD-033, and it means the Studio↔CIE skill-sentence contract
      # is not verified by CI.
      #
      # `httpx` is not optional: starlette's TestClient requires it, and every
      # test that builds the app was erroring on its absence.
      # `githubkit` and `cryptography` carry the GitHub App chain (`D-56`) and
      # sign the key that tests it. `--no-deps` above means a dependency added
      # to `pyproject.toml` reaches the host and **not** here, so the first sign
      # of forgetting this line is a green pipeline over code that cannot
      # import (`D-57`).
      - run: pip install -e . --no-deps && pip install fastapi itsdangerous pytest httpx "githubkit[auth-app]" cryptography
      - run: python -m pytest tests -q
