[project]
name = "kae-studio-backend"
version = "0.1.0"
description = "KAE-Studio's trusted application boundary: the only thing that holds a KAE-Memory credential."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "itsdangerous>=2.2",
  # The interviewer. Studio transports and renders; every conversational
  # decision is CIE's, and this dependency is what keeps it that way rather
  # than Studio growing its own.
  "cris-cie-slim",
  "anthropic>=0.40",
  # The GitHub App chain — JWT, installation access token, refresh before
  # expiry, installation listing — which `D-56` exists so that we do not write.
  # `httpx`- and `pydantic`-based, so it adds a dependency and no runtime.
  "githubkit[auth-app]>=0.16",
  "boto3>=1.34",
  # Local file decode (`VC-06/H`). Memory's document route is text only;
  # Studio turns allowed uploads into that text on this host, in process,
  # with no third-party reader.
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "mypy>=1.11", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kae_studio"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.mypy]
files = ["src"]
strict = true
